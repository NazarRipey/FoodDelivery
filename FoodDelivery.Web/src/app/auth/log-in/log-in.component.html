<div class="modal-content">
    <div class="modal-header">
        <h4 class="modal-title">
            Log in
        </h4>
        <button class="close" (click)="modalRef.close()">&times;</button>
    </div>
    <div class="modal-body">
        <form [formGroup]="logInForm">
            <div class="form-group">
                <label>
                    Email:
                    <input type="email" class="form-control" formControlName="email">
                    <div *ngIf="logInForm.get('email').errors && logInForm.get('email').touched"
                        class="text-danger">
                        <small class="d-block" *ngIf="logInForm.get('email').hasError('required')">
                            Email is required
                        </small>
                        <small class="d-block" *ngIf="logInForm.get('email').hasError('email')">
                            Email should match the pattern example@mail.com
                        </small>
                    </div>
                </label>
            </div>
            <div class="form-group">
                <label>
                    Password:
                    <input type="password" class="form-control" formControlName="password">
                    <div *ngIf="logInForm.get('password').errors && logInForm.get('password').touched"
                        class="text-danger">
                        <small class="d-block" *ngIf="logInForm.get('password').hasError('required')">
                            Password is required
                        </small>
                    </div>
                </label>
            </div>
            <div class="form-group">
                <div class="form-check">
                    <label class="form-check-label">
                        <input type="checkbox" class="form-check-input" formControlName="remember">
                        Remember me
                    </label>
                </div>
            </div>
            <div class="text-center mt-2">
                <button class="btn btn-green" type="submit" [disabled]="logInForm.invalid">Log in</button>
            </div>
            <div class="text-center mt-3">
                <a (click)="openSignUp()" href="javascript:void(0);">I don't have an account</a>
            </div>
        </form>        
    </div>
</div>
