<div class="text-right">
    <ngb-rating [(rate)]="dish.rating" 
    max="5" [readonly]="true">
    <ng-template let-fill="fill" >
       <span class="default-rating" [class.filled]="fill === 100">
           <span class="painted-rating" [style.width.%]="fill">&#9733;</span>&#9733;
       </span>
     </ng-template>
   </ngb-rating>
   <span class="mx-1">{{dish.rating.averageRating}} 
       <small>({{dish.rating.ratedCount}})</small>
    </span>
</div>
<img src="{{imgSrc}}" class="list-image">
<div class="d-flex justify-content-between my-2 mx-3">
    <button class="btn bg-green" (click)="openAddToCart()">
        Add to cart
    </button>
    <button class="btn bg-popstar" [routerLink]="['/dishes', dish.id]">
        Details
    </button>
</div>
<div>
    <span>{{dish.name}}</span>
</div>
<div>
    <span>{{dish.price}}₴</span>
</div>
