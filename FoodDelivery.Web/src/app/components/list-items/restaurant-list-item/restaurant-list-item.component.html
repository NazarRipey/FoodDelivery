<a [routerLink]="['/restaurants', restaurant.name]">
    <app-readonly-rating [average]="restaurant.rating.averageRating" 
        [ratedCount]="restaurant.rating.ratedCount">
    </app-readonly-rating>
    <img [src]="restaurant.base64Image" class="list-image">
    <div>
        <span>{{restaurant.name}}</span>
    </div>
</a>
