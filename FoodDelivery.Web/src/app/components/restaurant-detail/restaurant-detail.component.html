<div *ngIf="restaurant?.status">
    <div *ngIf="restaurant.status==statuses.Active">
        <div class="text-center">
            <h1>{{restaurant.name}}</h1>
        </div>
        <div class="detail-wrapper mx-5 my-2">
            <img [src]="restaurant.base64Image" class="restaurant-image">
            <div class="w-100">
                <div>
                    <small>your rate:</small>
                    <ngb-rating [(rate)]="restaurant.userRating" max="5" (rateChange)="rateRestaurant()"
                    [readonly]="!userHelper.isInRole(['customer'])">
                    <ng-template let-fill="fill" >
                       <span class="default-rating font-x-large" [class.filled]="fill === 100">
                           <span class="painted-rating font-x-large" [style.width.%]="fill">&#9733;</span>&#9733;
                       </span>
                     </ng-template>
                    </ngb-rating>
                    <span class="ml-5 font-x-large">{{restaurant.rating.averageRating}} 
                        <small>({{restaurant.rating.ratedCount}})</small>
                    </span>    
                </div>

                <p class="container mt-3">{{restaurant.description}}</p>
                <p>Type: {{restaurant?.type?.name}}</p>
                <p>Addresses:</p>
                <ul>
                    <li *ngFor="let address of restaurant.addresses" class="my-2">
                        {{address.city}}, {{address.address}}
                    </li>
                </ul>
            </div>   
        </div>
        <div class="text-center">
            <h3 id="menu">Menu</h3>
        </div>
        <div class="p-md-3">
            <div class="card text-center">
                <div class="mx-auto my-2 search">
                    <app-search [value]="filterParams.search" placeholder="I'm looking for..."></app-search>
                </div>
                <div class="card-body d-flex">
                    <ul class="col justify-content-around">
                        <li *ngFor="let dish of dishes | paginate: config" 
                            class="mb-2 list-item">
                            <app-dish-list-item [dish]="dish"></app-dish-list-item>
                        </li>
                    </ul>
                </div>
                <div class="card-footer pb-0 pt-3">
                    <pagination-controls 
                        (pageChange)="pageChanged($event)">
                    </pagination-controls>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="restaurant.status!=statuses.Active" class="text-center">
        <h2>{{restaurant.name}} is inactive</h2>
    </div>
</div>
