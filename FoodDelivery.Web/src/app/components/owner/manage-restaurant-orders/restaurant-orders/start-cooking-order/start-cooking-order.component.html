<div class="modal-content">
    <div class="modal-header">
        <h4 class="modal-title">
            Order items
        </h4>
        <button class="close" (click)="modalRef.close()">&times;</button>
    </div>
    <div class="modal-body">
        <table class="table table-striped">
            <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">Price</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Status</th>
                  <th scope="col">Subtotal</th>
                  <th scope="col">Requested quantity</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of items; let i = index">
                  <td>{{item.orderItem.dish.name}}</td>
                  <td>{{item.orderItem.dish.price}}</td>
                  <td>{{item.orderItem.quantity}}</td>
                  <td>{{itemStatuses[item.status]}}</td>
                  <td><b>{{item.orderItem.quantity * item.orderItem.dish.price}}</b></td>
                  <td>
                    <input [disabled]="changeRequested()" class="w-75" type="number" onkeypress="return (event.charCode == 8 || event.charCode == 0 || event.charCode == 13) ? null : event.charCode >= 48 && event.charCode <= 57" 
                      min="1" [(ngModel)]="item.requestedQuantity">
                  </td>
                </tr>
              </tbody>
        </table>  
        <div class="text-center">
          <p><b>Total: {{total}}</b></p>
        </div>

        <div class="text-center" *ngIf="!changeRequested()">
            <button class="btn bg-green mx-2" (click)="startCooking()"
                [disabled]="quantityChanged()">Start cooking</button>
            <button class="btn btn-warning mx-2" (click)="requestQuantityChange()"
                [disabled]="!quantityChanged()">Request quantity change</button>
        </div>
    </div>
</div>
