<div class="modal fade show" tabindex="-1" role="dialog"
  style="display: block;" data-keyboard="false" data-backdrop="static">
    <div class="modal-dialog" >
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    Update {{restaurant.name}}
                </h4>
                <button class="close" (click)="modalRef.close()">&times;</button>
            </div>
            <div class="modal-body">
                <form [formGroup]="updateRestaurantForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label class="w-100">
                            Description
                            <textarea class="form-control" formControlName="description">
                            </textarea>
                            <div *ngIf="updateRestaurantForm.get('description').errors 
                                && updateRestaurantForm.get('description').touched" class="text-danger">
                                <small class="d-block" 
                                    *ngIf="updateRestaurantForm.get('description').hasError('required')">
                                    Description is required
                                </small>
                            </div>
                        </label>
                    </div>
                    
                    <div *ngIf="updateRestaurantForm.hasError('server') && updateRestaurantForm.touched"
                    class="text-danger">
                        <div [ngSwitch]="updateRestaurantForm.errors['server']">
                            <p *ngSwitchCase="restaurantErrors.ModelInvalid">
                                Model is invalid
                            </p>
                            <p *ngSwitchCase="restaurantErrors.AlreadyExistsName">
                                Restaurant with such name already exists.
                            </p>
                            <p *ngSwitchDefault>
                                {{updateRestaurantForm.errors['server']}}
                            </p>
                        </div>
                    </div>

                    <div class="text-right">
                        <button class="btn btn-green mx-2" type="submit" [disabled]="updateRestaurantForm.invalid">
                            Update
                        </button>
                        <button class="btn btn-danger mx-2" type="button" (click)="modalRef.close()">
                            Cancel
                        </button>
                    </div>
                </form>        
            </div>
        </div>
    </div>
</div>
