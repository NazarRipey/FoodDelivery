<div class="modal fade show" tabindex="-1" role="dialog"
  style="display: block;" data-keyboard="false" data-backdrop="static">
    <div class="modal-dialog" >
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    Add new restaurant
                </h4>
                <button class="close" (click)="modalRef.close()">&times;</button>
            </div>
            <div class="modal-body">
                <form [formGroup]="addRestaurantForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label class="w-100">
                            Name
                            <input type="text" class="form-control" formControlName="name">
                            <div *ngIf="addRestaurantForm.get('name').errors 
                                    && addRestaurantForm.get('name').touched" class="text-danger">
                                <small class="d-block" 
                                    *ngIf="addRestaurantForm.get('name').hasError('required')">
                                    Name is required
                                </small>
                            </div>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="w-100">
                            Description
                            <textarea class="form-control" formControlName="description">
                            </textarea>
                            <div *ngIf="addRestaurantForm.get('description').errors 
                                && addRestaurantForm.get('description').touched" class="text-danger">
                                <small class="d-block" 
                                    *ngIf="addRestaurantForm.get('description').hasError('required')">
                                    Description is required
                                </small>
                            </div>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="w-50">
                            Type
                            <select class="form-control" formControlName="type">
                                <option *ngFor="let type of types" [ngValue]="type">
                                    {{type.name}}
                                </option>
                            </select>
                            <div *ngIf="addRestaurantForm.get('type').errors && 
                                addRestaurantForm.get('type').touched"
                            class="text-danger">
                                <small class="d-block" 
                                    *ngIf="addRestaurantForm.get('type').hasError('required')">
                                    Restaurant type is required
                                </small>
                            </div>
                        </label>
                    </div>
                    <div class="text-center">
                        <button type="button" (click)="uploadImage()" class="btn btn-sm mt-1 bg-blue">
                            Upload image
                        </button>
                    </div>
                    <button type="button" class="btn bg-green mb-2" (click)="addAddress()">Add Address</button>
                    <section class="mb-2" formArrayName="addresses" 
                        *ngFor="let address of addressControls; let i = index;">
                        <div [formGroupName]="i">
                            <div class="row">
                                <div class="col-6">
                                    <h4>Address №{{i + 1}}</h4>
                                </div>
                                <div class="col-6 text-right">
                                    <button type="button" class="btn btn-danger btn-sm" [disabled]="addresses.length==1"
                                     (click)="removeAddress(i)">Remove</button>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <div class="form-group">
                                        <label>City</label>
                                        <input type="text" class="form-control" formControlName="city" placeholder="Lviv"/>
                                        <div *ngIf="address.get('city').errors 
                                            && address.get('city').touched" class="text-danger">
                                            <small class="d-block" 
                                                *ngIf="address.get('city').hasError('required')">
                                                City is required
                                            </small>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-group">
                                        <label>Address</label>
                                        <input type="text" class="form-control" formControlName="address" placeholder="Lukasha, 5"/>
                                        <div *ngIf="address.get('address').errors 
                                            && address.get('address').touched" class="text-danger">
                                            <small class="d-block" 
                                                *ngIf="address.get('address').hasError('required')">
                                                Address is required
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <hr>
                        </div>
                    </section>
                    
                    <div *ngIf="addRestaurantForm.hasError('server') && addRestaurantForm.touched"
                    class="text-danger">
                        <div [ngSwitch]="addRestaurantForm.errors['server']">
                            <p *ngSwitchCase="restaurantErrors.ModelInvalid">
                                Model is invalid
                            </p>
                            <p *ngSwitchCase="restaurantErrors.AlreadyExistsName">
                                Restaurant with such name already exists.
                            </p>
                            <p *ngSwitchDefault>
                                {{addRestaurantForm.errors['server']}}
                            </p>
                        </div>
                    </div>

                    <div class="text-right">
                        <button class="btn bg-green mx-2" type="submit" [disabled]="addRestaurantForm.invalid">
                            Add
                        </button>
                        <button class="btn btn-danger mx-2" type="button" (click)="modalRef.close()">
                            Cancel
                        </button>
                    </div>
                </form>        
            </div>
        </div>
    </div>
</div>
