<div class="modal fade show" tabindex="-1" role="dialog"
  style="display: block;" data-keyboard="false" data-backdrop="static">
    <div class="modal-dialog" >
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    Add address
                </h4>
                <button class="close" (click)="modalRef.close()">&times;</button>
            </div>
            <div class="modal-body">
                <form [formGroup]="addAddressForm" (ngSubmit)="onSubmit()">
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" class="form-control" formControlName="city" placeholder="Lviv"/>
                                <div *ngIf="addAddressForm.get('city').errors 
                                    && addAddressForm.get('city').touched" class="text-danger">
                                    <small class="d-block" 
                                        *ngIf="addAddressForm.get('city').hasError('required')">
                                        City is required
                                    </small>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" class="form-control" formControlName="address" placeholder="Lukasha, 5"/>
                                <div *ngIf="addAddressForm.get('address').errors 
                                    && addAddressForm.get('address').touched" class="text-danger">
                                    <small class="d-block" 
                                        *ngIf="addAddressForm.get('address').hasError('required')">
                                        Address is required
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-right mt-2">
                        <button class="btn bg-green mx-2" type="submit" [disabled]="addAddressForm.invalid">
                            Add
                        </button>
                        <button class="btn btn-danger mx-2" type="button" (click)="modalRef.close()">
                            Cancel
                        </button>
                    </div>
                </form>        
            </div>
        </div>
    </div>
</div>
