<div class="text-center">
    <button class="btn btn-green my-3" (click)="addRestaurant()">Add new restaurant</button>
    <h4>{{userHelper.profile.firstName}} {{userHelper.profile.lastName}}'s restaurants:</h4>
</div>

<div class="mx-5 my-2" *ngFor="let rs of restaurants">
    <div class="wrapper d-flex align-items-stretch">
        <img src="{{imgSrc}}" class="mr-2 w-75">
        <div class="w-100">
            <div class="text-right">
                <button class="btn btn-teamblue"><i class="bi bi-pencil"></i></button>
            </div>
            <div class="text-center">
                <p class="lead"><b>{{rs.name}}</b></p>
                <p>{{rs.description}}</p>
            </div>
            <p>Addresses:</p>
            <ul>
                <li *ngFor="let address of rs.addresses">
                    {{address.city}}, {{address.address}}
                </li>
            </ul>
            <div class="text-center">
                <button class="btn btn-green">Manage menu</button>
            </div>
        </div>    
    </div>
    <hr>
</div>
