<div *ngIf="userHelper.profile" class="border p-3 wrapper mx-auto my-2">
    <div class="text-right">
        <button class="btn bg-blue mx-3" (click)="openUpdateForm()">
            <i class="bi bi-pencil"></i>
        </button>
        <button  *ngIf="this.userHelper.isInRole(['customer'])" (click)="deactivateAccount()"
         class="btn btn-danger">
         Deactivate
        </button>
    </div>
    <div class="d-flex justify-content-between my-3">
        <div class="img-wrapper">
            <img class="profile-image" [src]="userHelper.profile.base64Image">
            <div class="img-overlay">
                <div ngbDropdown display="dynamic">
                    <button class="btn" class="btn btn-sm bg-blue"
                        ngbDropdownToggle>
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <div ngbDropdownMenu >
                        <input style="display: none;" type="file" #profileImage
                        (change)="onProfileImageChange($event)">
                        <button (click)="profileImage.click()" class="btn btn-sm" ngbDropdownItem>
                            Change image         
                        </button>
                        <button (click)="deleteProfileImage()" class="btn btn-sm" ngbDropdownItem>
                            Delete image
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="w-50 my-auto mx-3">           
            <p>First name: {{userHelper.profile.firstName}}</p>
            <p>Last name: {{userHelper.profile.lastName}}</p>
            <p>Email: {{userHelper.profile.email}}</p>
        
            <p>Phone number: {{userHelper.profile.phoneNumber}}</p>
            <p>Birthday: {{userHelper.profile.birthday | date:'longDate'}}</p>
            <p>Address: {{userHelper.profile.address}}</p>
        </div>
    </div>    
</div>
