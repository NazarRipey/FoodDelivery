<div *ngIf="userHelper.profile" class="border p-3 wrapper mx-auto my-2">
    <div class="text-right">
        <button class="btn bg-blue mx-3" (click)="openUpdateForm()">
            <i class="bi bi-pencil"></i>
        </button>
        <button  *ngIf="this.userHelper.isInRole(['customer'])" (click)="deactivateAccount()"
         class="btn btn-danger">
         Deactivate
        </button>
    </div>
    <div class="d-flex justify-content-between my-3">
        <div>
            <div class="text-center">
                <img class="mx-3 w-75" src="{{imgSrc}}">
            </div>
            <div class="text-center my-2">
                <button class="btn bg-blue">Change profile picture</button>
            </div>
        </div>
        <div class="w-50 my-auto">           
            <p>First name: {{userHelper.profile.firstName}}</p>
            <p>Last name: {{userHelper.profile.lastName}}</p>
            <p>Email: {{userHelper.profile.email}}</p>
        
            <p>Phone number: {{userHelper.profile.phoneNumber}}</p>
            <p>Birthday: {{userHelper.profile.birthday | date:'longDate'}}</p>
            <p>Address: {{userHelper.profile.address}}</p>
        </div>
    </div>    
</div>
