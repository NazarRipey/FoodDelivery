<div class="modal fade show" tabindex="-1" role="dialog"
  style="display: block;" data-keyboard="false" data-backdrop="static">
    <div class="modal-dialog" >
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">
                    Confirm email
                </h4>
            </div>
            <div class="modal-body">
                <p>Confirmation code has been sent to <b>{{email}}</b></p>
                <form [formGroup]="confirmEmailForm" (ngSubmit)="onCodeSubmited()">
                    <label>
                        Please enter the code:
                        <input class="form-control" type="number" formControlName="code">
                        <div *ngIf="confirmEmailForm.get('code').errors && confirmEmailForm.get('code').touched"
                            class="text-danger">
                            <small class="d-block" *ngIf="confirmEmailForm.get('code').hasError('required')">
                                Code name is required
                            </small>
                        </div>
                    </label>
                    
                    <div *ngIf="confirmEmailForm.hasError('server') && confirmEmailForm.touched"
                    class="text-danger">
                        <div [ngSwitch]="confirmEmailForm.errors['server']">
                            <p *ngSwitchCase="errorsEnum.WrongConfirmationCode">
                                Wrong confirmation code
                            </p>
                            <p *ngSwitchCase="errorsEnum.ModelInvalid">
                                Model is invalid
                            </p>
                            <p *ngSwitchDefault>
                                {{logInForm.errors['server']}}
                            </p>
                        </div>
                    </div>

                    <div>
                        <button type="button" (click)="SendAgain()" class="btn btn-warning">Send again</button>
                    </div>
                    <div class="text-right">
                        <button class="btn bg-green mx-2" type="submit" [disabled]="confirmEmailForm.invalid">Next</button>
                        <button class="btn btn-danger mx-2" type="button" (click)="Skip()">Not now</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
