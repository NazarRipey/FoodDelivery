<div class="modal-content">
    <div class="modal-header">
        <h4 class="modal-title">
            Sign up
        </h4>
        <button class="close" (click)="modalRef.close()">&times;</button>
    </div>
    <div class="modal-body">
        <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
            <div class="form-row form-group">
                    <label class="col">
                        First name:
                        <input type="text" class="form-control" formControlName="firstName">
                        <div *ngIf="signUpForm.get('firstName').errors && signUpForm.get('firstName').touched"
                            class="text-danger">
                            <small class="d-block" *ngIf="signUpForm.get('firstName').hasError('required')">
                                First name is required
                            </small>
                            <small class="d-block" *ngIf="signUpForm.get('firstName').hasError('pattern')">
                                First name can only have letters or dash charcter(-)
                            </small>
                        </div>
                    </label>
                <label class="col">
                    Last name:
                    <input type="text" class="form-control" formControlName="lastName">
                    <div *ngIf="signUpForm.get('lastName').errors && signUpForm.get('lastName').touched"
                        class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.get('lastName').hasError('required')">
                            Last name is required
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('lastName').hasError('pattern')">
                            Last name can only have letters or dash charcter(-)
                        </small>
                    </div>
                </label>
            </div>
            <div class="form-group form-row">
                <label class="col">
                    Email:
                    <input type="email" class="form-control" style="width: 100%;" formControlName="email">
                    <div *ngIf="signUpForm.get('email').errors && signUpForm.get('email').touched"
                    class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.get('email').hasError('required')">
                            Email is required
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('email').hasError('email')">
                            Email should match the pattern example@mail.com
                        </small>
                    </div>
                </label>
                <label class="col">
                    Phone number:
                    <input type="text" class="form-control" formControlName="phoneNumber"
                        placeholder="format: +380679348848">
                    <div *ngIf="signUpForm.get('phoneNumber').errors && signUpForm.get('phoneNumber').touched"
                    class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.get('phoneNumber').hasError('required')">
                            Phone is required
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('phoneNumber').hasError('pattern')">
                            Phone should match the pattern +380123456789
                        </small>
                    </div>
                </label>
            </div>
            <div class="form-group">
                <label>
                    Birthday: 
                    <input type="date" class="form-control"  formControlName="birthday">
                    <div *ngIf="signUpForm.get('birthday').errors && signUpForm.get('birthday').touched"
                    class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.get('birthday').hasError('required')">
                            Birthday is required
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('birthday').hasError('age')">
                            You must be over 13 years old to join FoodDelivery
                        </small>
                    </div>
                </label>
            </div>
            <div class="form-group form-row">
                <label class="col">
                    Password:
                    <input type="password" class="form-control" formControlName="password">
                    <div *ngIf="signUpForm.get('password').errors && signUpForm.get('password').touched"
                    class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.get('password').hasError('required')">
                            Password is required
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('password').hasError('minlength')">
                            Password should be at least 8 characters
                        </small>
                        <small class="d-block" *ngIf="signUpForm.get('password').hasError('pattern')">
                            Password should contain one lowercase charcter, one uppercase charcter, and one number
                        </small>
                    </div>
                </label>
                <label class="col">
                    Confirm password:
                    <input type="password" class="form-control" formControlName="confirmPassword">
                    <div *ngIf="signUpForm.get('confirmPassword').touched" class="text-danger">
                        <small class="d-block" *ngIf="signUpForm.hasError('confirmPassword')">
                            Passwords do not match
                        </small>
                    </div>
                </label>
            </div>

            <label>
                Role:
                <div>
                    <input type="radio" name="roles" id="customer" [value]="['customer']"
                     formControlName="roles">
                    <label for="customer">
                        Customer (I want to order food)
                    </label>
                </div>
                <div>
                    <input type="radio" name="roles" id="owner" [value]="['owner', 'customer']"
                     formControlName="roles">
                    <label for="owner">
                        Restaurant owner (I want to post new dishes and order food)
                    </label>
                </div>
            </label>

            <div *ngIf="signUpForm.hasError('server') && signUpForm.touched"
            class="text-danger">
                <div [ngSwitch]="signUpForm.errors['server']">
                    <p *ngSwitchCase="errorsEnum.WrongEmailPassword">
                        Wrong email or password
                    </p>
                    <p *ngSwitchCase="errorsEnum.AlreadyExistsEmail">
                        User with such email already exists
                    </p>
                    <p *ngSwitchCase="errorsEnum.AlreadyExistsPhone">
                        User with such phone number already exists
                    </p>
                    <p *ngSwitchCase="errorsEnum.ModelInvalid">
                        Model is invalid
                    </p>
                    <p *ngSwitchDefault>
                        {{logInForm.errors['server']}}
                    </p>
                </div>
            </div>

            <hr>

            <p>By clicking <u>Sign up</u> you agree to our <a href="1234">Privacy policy</a></p>
            <div class="text-center">
                <button type="submit" class="btn bg-green" [disabled]="signUpForm.invalid">Next</button>   
            </div>

            <div class="text-center mt-3">
                <a (click)="openLogIn()" href="javascript:void(0);">I already have an account</a> 
            </div>
        </form>        
    </div>
</div>
