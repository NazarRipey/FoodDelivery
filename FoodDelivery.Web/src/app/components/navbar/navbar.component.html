<nav class="navbar navbar-expand-lg border-bottom mb-2 d-flex">
    <a class="nav-link logo" [routerLink]="['/']">
        <h2>Food<span class="text-green">Delivery</span></h2>
    </a>
    <ul class="nav nav-pills mr-auto">
        <li class="nav-item">
            <a class="nav-link" [routerLink]="['/dishes']">Dishes</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" [routerLink]="['/restaurants']">Restaurants</a>
        </li>
    </ul>

    <div *ngIf="userHelper.profile$ | async; else unauthorized">
        <ul class="nav nav-pills ml-auto" >
            <li class="nav-item" class="my-auto">
                welcome, {{userHelper.profile.firstName}}
            </li>
            <li class="nav-item">
                <div ngbDropdown class="nav-link">
                    <button class="btn btn-outline-primary" id="profile" class="btn btn-green"
                        ngbDropdownToggle><i class="bi bi-person"></i></button>
                    <div ngbDropdownMenu aria-labelledby="profile">
                        <a ngbDropdownItem class="px-1">My profile</a>
                        <a ngbDropdownItem class="px-1">Order History</a>
                        <a ngbDropdownItem class="px-1">Setting</a>
                        <a ngbDropdownItem class="px-1" (click)="LogOut()">Log out</a>
                    </div>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-link"><i class="bi bi-cart4"></i></a>
            </li>
        </ul>
    </div>

    <ng-template #unauthorized>        
        <button class="navbar-toggler" type="button" data-toggle="collapse" 
        (click)="toggleNavbar = !toggleNavbar" data-target="#account" aria-controls="account" aria-expanded="false"
        aria-label="Toggle navigation">
            <i class="bi bi-person"></i>
        </button>
        <div class="collapse navbar-collapse" id="account" [ngbCollapse]="toggleNavbar">
            <ul class="nav nav-pills ml-auto">
                <li class="nav-item ml-auto">
                    <a class="nav-link" (click)="openSignUp()">Sign up</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" (click)="openLogIn()">Log in</a>
                </li>
            </ul>
        </div>
    </ng-template>
</nav>
