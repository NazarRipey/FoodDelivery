<div class="row d-flex mb-3 mt-2">
  <div class="mx-auto search">
    <app-search [value]="requestFilterParams.search" placeholder="John Doe"></app-search>
  </div>

  <app-status-drop-down [selectedStatus]="selectedStatus" [statuses]="statuses"></app-status-drop-down>  
</div>

<div class="table-responsive">
  <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col" [queryParams]="{sort:sortTypes.Name, asc:!ascending}"
           queryParamsHandling='merge' [routerLink]="[]">
            Name 
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.Type, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Type 
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.OwnerName, asc:!ascending}" 
            queryParamsHandling='merge' [routerLink]="[]">
            Owner name
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.Email, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Email
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.PhoneNumber, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Phone number
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.CreatedDate, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Created date
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.ClosedDate, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Closed date
          </th>
          <th scope="col" [queryParams]="{sort:sortTypes.Status, asc:!ascending}"
            queryParamsHandling='merge' [routerLink]="[]">
            Status
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let request of requests$| async | paginate: config">
          <td>{{request.name}}</td>
          <td>{{request.type.name}}</td>
          <td>{{request.userProfile.fullName}}</td>
          <td>{{request.userProfile.email}}</td>
          <td>{{request.userProfile.phoneNumber}}</td>
          <td>{{request.createdDate}}</td>
          <td>{{request.closedDate}}</td>
          <td>{{statuses[request.status]}}</td>
          <td>
            <button title="Approve" (click)="Approve(request.id)" class="btn btn-sm bg-green"
              [disabled]="request.status==statuses.Approved">
              <i class="bi bi-check"></i>
            </button>
          </td>
          <td>
            <button title="Decline" (click)="Decline(request.id)" class="btn btn-sm btn-danger"
              [disabled]="request.status==statuses.Declined">
              <i class="bi bi-x"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>  
</div>
<div class="text-center pb-0 pt-3">
  <pagination-controls 
    (pageChange)="pageChanged($event)">
  </pagination-controls>
</div>
