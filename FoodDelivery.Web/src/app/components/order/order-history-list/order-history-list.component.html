<div class="container">
    <div class="row d-flex mb-3 mt-2">
        <div class="input-group search mx-auto">
            <input type="search" #search class="form-control" (search)="onSearch(search.value)"
                placeholder="I'm looking for..." value="{{orderFilterParams.search}}"/>
            <button type="submit" class="btn bg-popstar" (click)="onSearch(search.value)">
                <i class="bi bi-search"></i>
            </button>
        </div>
        
        <div ngbDropdown display="dynamic">
            <button class="btn btn-outline-primary" id="sortDropDown" class="btn bg-popstar"
            ngDefaultControl 
             ngbDropdownToggle>{{selectedStatus}}</button>
            <div ngbDropdownMenu aria-labelledby="sortDropDown">
                <a ngbDropdownItem [queryParams]="{status:null}" queryParamsHandling='merge' [routerLink]="[]">
                    All
                </a>
                <a ngbDropdownItem *ngFor="let status of statuses | enumKeys"
                    [queryParams]="{status:status}" queryParamsHandling='merge' [routerLink]="[]">
                    {{status}}
                </a>
            </div>
        </div>
    </div>    
</div>

<div class="b">
    <div class="text-center mb-2">
        <h2><a [routerLink]="['/orders']">Active orders</a></h2>
    </div>
    
    <div class="wrapper d-flex align-items-stretch mt-2" *ngIf="orderResponse.orders">
        <div class="p-md-3 w-100">
            <div *ngIf="orderResponse.orders.length == 0">
                <div class="text-center">
                    <h4>Order history is empty</h4>
                    <i class="bi bi-clipboard-x"></i>
                </div>
            </div>
            <div *ngIf="orderResponse.orders.length > 0">
                <h4 class="text-center">Order history</h4>
                <div class="container card">
                    <div class="card-body">
                        <ul class="d-block">
                            <li *ngFor="let order of orderResponse.orders | paginate: config" 
                                class="mb-2 list-item">
                                <app-order-list-item [order]="order"></app-order-list-item>
                            </li>
                        </ul>
                    </div>
                    <div class="card-footer text-center pb-0 pt-3">
                        <pagination-controls 
                            (pageChange)="pageChanged($event)">
                        </pagination-controls>
                    </div>
                </div>
            </div>
        </div>    
    </div>
</div>
