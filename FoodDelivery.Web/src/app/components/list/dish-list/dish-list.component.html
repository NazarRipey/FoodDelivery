<div class="container">
    <div class="row d-flex">
        <button class="navbar-toggler btn bg-popstar" type="button" data-toggle="filter" 
        (click)="toggleFilters = !toggleFilters" data-target="#filter" aria-controls="filter" aria-expanded="false"
        aria-label="Toggle navigation">
            <i class="bi bi-filter"></i>
        </button>

        <div class="mx-auto search">
            <app-search [value]="dishFilterParams.search" placeholder="I'm looking for.."></app-search>
        </div>

        <app-sort-drop-down [selectedsortType]="selectedsortType" [sortTypes]="dishSortTypes">
        </app-sort-drop-down>
    </div>
</div>

<div class="wrapper d-flex align-items-stretch mt-2">
    <nav class="ml-2 px-1 pt-2" id="filter" [ngbCollapse]="toggleFilters">
        <h4>Filters</h4>
        <a [routerLink]="[]">Clear all</a>
        <div class="custom-slider" *ngIf="sliderOptions.options">
            <ngx-slider (mouseup)="changePriceRange()" 
            [(value)]="sliderOptions.currentMin" [(highValue)]="sliderOptions.currentMax"
             [options]="sliderOptions.options"></ngx-slider>
        </div>
        <app-filter name="Restaurant" [options]="restaurantNames"></app-filter>
        <app-filter name="Category" [options]="dishCategories"></app-filter>
    </nav>
    <div class="p-md-3 w-100">
        <div class="card text-center">
            <div class="card-body d-flex">
                <ul class="col justify-content-around">
                    <li *ngFor="let dish of dishResponse.dishes | paginate: config" class="mb-2 list-item">
                        <app-dish-list-item [dish]="dish"></app-dish-list-item>
                    </li>
                </ul>
            </div>
            <div class="card-footer pb-0 pt-3">
                <pagination-controls 
                    (pageChange)="pageChanged($event)">
                </pagination-controls>
            </div>
        </div>
    </div>    
</div>
