<div class="container">
    <div class="row d-flex">
        <button class="navbar-toggler btn bg-popstar" type="button" data-toggle="filter" 
        (click)="toggleFilter = !toggleFilter" data-target="#filter" aria-controls="filter" aria-expanded="false"
        aria-label="Toggle navigation">
            <i class="bi bi-filter"></i>
        </button>

        <div class="mx-auto search">
            <app-search [value]="restaurantFilterParams.search" placeholder="I'm looking for..."></app-search>
        </div>

        <app-sort-drop-down [selectedsortType]="selectedsortType" [sortTypes]="restaurantSortTypes">
        </app-sort-drop-down>
    </div>
</div>

<div class="wrapper d-flex align-items-stretch mt-2">
    <nav class="ml-2 px-1 pt-2" id="filter" [ngbCollapse]="toggleFilter">
        <h4>Filters</h4>
        <app-filter name="Type" [options]="restaurantTypeNames"></app-filter>
    </nav>
    <div class="p-md-3 w-100">
        <div class="card text-center">
            <div class="card-body d-flex">
                <ul class="col justify-content-around">
                    <li *ngFor="let rs of restaurantResponse.restaurants | paginate: config" 
                            class="mb-2 list-item">
                            <app-restaurant-list-item [restaurant]="rs"></app-restaurant-list-item>
                    </li>
                </ul>
            </div>
            <div class="card-footer pb-0 pt-3">
                <pagination-controls 
                    (pageChange)="pageChanged($event)">
                </pagination-controls>
            </div>
        </div>
    </div>    
</div>
